# @package _global_
defaults:
  - _self_

# ============================================================================
# Holes Detection - SAM3 Finetuning Configuration WITH PARAMETER FREEZING
# ============================================================================
# This configuration extends the base holes finetuning config with systematic
# parameter freezing options.
#
# SAM3 IMAGE MODEL ARCHITECTURE:
# ==============================
# BACKBONE (pretrained):
#   - vision_backbone:    backbone.vision_backbone.*
#   - language_backbone:  backbone.language_backbone.*
#
# GEOMETRY ENCODER (encodes spatial prompts like boxes/points):
#   - geometry_encoder:   geometry_encoder.*
#
# TRANSFORMER:
#   - transformer_encoder: transformer.encoder.*
#   - transformer_decoder: transformer.decoder.*
#
# OUTPUT HEADS:
#   - segmentation_head:  segmentation_head.*
#   - dot_prod_scoring:   dot_prod_scoring.*
#
# FREEZING OPTIONS:
# - freeze_config.vision_backbone: Freeze ViT image encoder
# - freeze_config.language_backbone: Freeze CLIP text encoder
# - freeze_config.geometry_encoder: Freeze spatial prompt encoder
# - freeze_config.transformer_encoder: Freeze vision-language fusion
# - freeze_config.transformer_decoder: Freeze object query decoder
# - freeze_config.segmentation_head: Freeze pixel decoder + mask predictor
# - freeze_config.dot_prod_scoring: Freeze classification scoring
# - freeze_config.custom_patterns: Additional patterns to freeze (Unix glob)
# - freeze_config.freeze_all_except: Freeze everything EXCEPT these patterns
# - freeze_config.unfreeze_patterns: Explicitly unfreeze these patterns
# - freeze_config.vision_backbone_num_frozen_layers: Freeze first N ViT blocks
#
# COMMON TRAINING STRATEGIES:
# 1. Full fine-tuning: All freeze options = false (default)
# 2. Backbone-frozen: vision_backbone=true, language_backbone=true
# 3. Minimal training: freeze backbones + geometry_encoder
# 4. Gradual unfreezing: vision_backbone_num_frozen_layers with decreasing N
# ============================================================================

# ============================================================================
# Paths Configuration (Change this to your own paths)
# ============================================================================
paths:
  dataset_root: /home/raul/workspace/data/training/holes/holes_20260127
  experiment_log_dir: /home/raul/workspace/experiments/holes_sam3_frozen_260127
  bpe_path: /home/raul/workspace/cc_segmentation_sam3/sam3/assets/bpe_simple_vocab_16e6.txt.gz

# Task configuration
task_name: holes

# Task-specific dataset configuration
holes_train:
  num_images: null  # Use all available images
  
  # Training transforms pipeline
  train_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterCrowds
        - _target_: sam3.train.transforms.point_sampling.RandomizeInputBbox
          box_noise_std: 0.1
          box_noise_max: 20
        - _target_: sam3.train.transforms.segmentation.DecodeRle
        - _target_: sam3.train.transforms.segmentation.InstanceToSemantic
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes:
            _target_: sam3.train.transforms.basic.get_random_resize_scales
            size: ${scratch.resolution}
            min_size: 480
            rounded: false
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.PadToSizeAPI
          size: ${scratch.resolution}
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.train_norm_mean}
          std: ${scratch.train_norm_std}
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets
    - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
      query_filter:
        _target_: sam3.train.transforms.filter_query_transforms.FilterFindQueriesWithTooManyOut
        max_num_objects: ${scratch.max_ann_per_img}

  # Validation transforms pipeline
  val_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.segmentation.DecodeRle
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes: ${scratch.resolution}
          max_size: ${scratch.resolution}
          square: true
          consistent_transform: True
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.train_norm_mean}
          std: ${scratch.train_norm_std}

  # Loss configuration WITH segmentation masks
  loss:
    _target_: sam3.train.loss.sam3_loss.Sam3LossWrapper
    matcher: ${scratch.matcher}
    o2m_weight: 2.0
    o2m_matcher:
      _target_: sam3.train.matcher.BinaryOneToManyMatcher
      alpha: 0.3
      threshold: 0.4
      topk: 4
    use_o2m_matcher_on_o2m_aux: false
    loss_fns_find:
      - _target_: sam3.train.loss.loss_fns.Boxes
        weight_dict:
          loss_bbox: 5.0
          loss_giou: 2.0
      - _target_: sam3.train.loss.loss_fns.IABCEMdetr
        weak_loss: False
        weight_dict:
          loss_ce: 20.0
          presence_loss: 20.0
        pos_weight: 10.0
        alpha: 0.25
        gamma: 2
        use_presence: True
        presence_gamma: 2
        pos_focal: false
        pad_n_queries: 200
        pad_scale_pos: 1.0
      - _target_: sam3.train.loss.loss_fns.Masks
        focal_alpha: 0.25
        focal_gamma: 2.0
        weight_dict:
          loss_mask: 200.0
          loss_dice: 10.0
        compute_aux: false
    loss_fn_semantic_seg:
      _target_: sam3.train.loss.loss_fns.SemanticSegCriterion
      presence_head: True
      presence_loss: False
      focal: True
      focal_alpha: 0.6
      focal_gamma: 2.0
      downsample: False
      weight_dict:
        loss_semantic_seg: 20.0
        loss_semantic_presence: 1.0
        loss_semantic_dice: 30.0
    scale_by_find_batch_size: ${scratch.scale_by_find_batch_size}

# ============================================================================
# Helper Parameters and Functions
# ============================================================================
scratch:
  enable_segmentation: True
  
  # Model parameters
  d_model: 256
  pos_embed:
    _target_: sam3.model.position_encoding.PositionEmbeddingSine
    num_pos_feats: ${scratch.d_model}
    normalize: true
    scale: null
    temperature: 10000

  # Box processing
  use_presence_eval: True
  original_box_postprocessor:
    _target_: sam3.eval.postprocessors.PostProcessImage
    max_dets_per_img: 10
    use_original_ids: true
    use_original_sizes_box: true
    use_original_sizes_mask: true
    use_presence: ${scratch.use_presence_eval}
    detection_threshold: 0.3
    iou_type: segm
    to_cpu: false

  # Matcher configuration
  matcher:
    _target_: sam3.train.matcher.BinaryHungarianMatcherV2
    focal: true
    cost_class: 2.0
    cost_bbox: 5.0
    cost_giou: 2.0
    alpha: 0.25
    gamma: 2
    stable: False
  scale_by_find_batch_size: True

  # Image processing parameters
  resolution: 1008
  consistent_transform: False
  max_ann_per_img: 200

  # Normalization parameters
  train_norm_mean: [0.5, 0.5, 0.5]
  train_norm_std: [0.5, 0.5, 0.5]
  val_norm_mean: [0.5, 0.5, 0.5]
  val_norm_std: [0.5, 0.5, 0.5]

  # Training parameters
  num_train_workers: 10
  num_val_workers: 0
  max_data_epochs: 100
  target_epoch_size: 2500
  hybrid_repeats: 1
  context_length: 2
  gather_pred_via_filesys: false

  # Learning rate and scheduler parameters
  # NOTE: When freezing backbones, you may want to increase decoder LR
  lr_scale: 0.5
  lr_transformer: ${times:8e-4,${scratch.lr_scale}}  # decoder/prompt encoder
  lr_vision_backbone: ${times:2.5e-4,${scratch.lr_scale}}  # image encoder (ignored if frozen)
  lr_language_backbone: ${times:5e-5,${scratch.lr_scale}}  # text encoder (ignored if frozen)
  lrd_vision_backbone: 0.95
  wd: 0.05
  scheduler_timescale: 20
  scheduler_warmup: 20
  scheduler_cooldown: 20

  val_batch_size: 1
  collate_fn_val:
    _target_: sam3.train.data.collator.collate_fn_api
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    dict_key: ${task_name}
    with_seg_masks: ${scratch.enable_segmentation}

  gradient_accumulation_steps: 1
  train_batch_size: 12
  collate_fn:
    _target_: sam3.train.data.collator.collate_fn_api
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    dict_key: ${task_name}
    with_seg_masks: ${scratch.enable_segmentation}

# ============================================================================
# Trainer Configuration WITH FREEZING
# ============================================================================

trainer:
  # Use the modified trainer with freezing support
  _target_: sam3.train.trainer_with_freezing.TrainerWithFreezing
  
  skip_saving_ckpts: false
  empty_gpu_mem_cache_after_eval: True
  skip_first_val: False
  max_epochs: 500
  accelerator: cuda
  seed_value: 123
  val_epoch_freq: 2
  mode: train
  gradient_accumulation_steps: ${scratch.gradient_accumulation_steps}

  # ============================================================================
  # PARAMETER FREEZING CONFIGURATION
  # ============================================================================
  # This section controls which parts of the model are frozen during training.
  # Frozen parameters will have requires_grad=False and won't be updated.
  #
  # SAM3 IMAGE MODEL ARCHITECTURE (actual parameter names):
  # =======================================================
  # BACKBONE (pretrained):
  #   - vision_backbone:    backbone.vision_backbone.*
  #   - language_backbone:  backbone.language_backbone.*
  #
  # GEOMETRY ENCODER (encodes spatial prompts like boxes/points):
  #   - geometry_encoder:   geometry_encoder.*
  #
  # TRANSFORMER:
  #   - transformer_encoder: transformer.encoder.*
  #   - transformer_decoder: transformer.decoder.*
  #
  # OUTPUT HEADS:
  #   - segmentation_head:  segmentation_head.*
  #   - dot_prod_scoring:   dot_prod_scoring.*
  #
  # VIDEO COMPONENTS (only in video models):
  #   - memory_encoder, memory_attention, obj_ptr
  #
  # RECOMMENDED STRATEGIES:
  #
  # Strategy 1: Full Fine-tuning (all false - train everything)
  #   Best for: Large datasets, when you want maximum adaptation
  #   Memory: ~24GB+ GPU
  #
  # Strategy 2: Freeze Backbones Only (vision + language = true)
  #   Best for: Small-medium datasets, faster training, less overfitting
  #   Memory: ~12-16GB GPU
  #   Trains: geometry_encoder, transformer, heads
  #
  # Strategy 3: Freeze Backbones + Geometry Encoder  
  #   Best for: Very small datasets, focus on decoder adaptation
  #   Memory: ~10-14GB GPU
  #   Trains: transformer, heads
  #
  # Strategy 4: Gradual Unfreezing (vision_backbone_num_frozen_layers)
  #   Best for: Transfer learning with layer-wise control
  #   Start with high N, decrease over epochs
  #
  # Strategy 5: Adapter-only (freeze_all_except)
  #   Best for: Extreme parameter efficiency, when adding adapter layers
  # ============================================================================
  
  freeze_config:
    # ==========================================================================
    # BACKBONE COMPONENTS (pretrained, typically frozen for fine-tuning)
    # ==========================================================================
    vision_backbone: true          # backbone.vision_backbone.*
    language_backbone: true        # backbone.language_backbone.*
    
    # ==========================================================================
    # GEOMETRY ENCODER (encodes boxes/points spatial prompts)
    # ==========================================================================
    geometry_encoder: true         # geometry_encoder.*
    
    # ==========================================================================
    # TRANSFORMER COMPONENTS
    # ==========================================================================
    transformer_encoder: false     # transformer.encoder.*
    transformer_decoder: false     # transformer.decoder.*
    
    # ==========================================================================
    # OUTPUT HEADS
    # ==========================================================================
    segmentation_head: false       # segmentation_head.*
    dot_prod_scoring: false        # dot_prod_scoring.*
    
    # ==========================================================================
    # VIDEO/TRACKING COMPONENTS (only present in video models, safe to ignore)
    # ==========================================================================
    memory_encoder: false          # memory_encoder.* (video only)
    memory_attention: false        # memory_attention.* (video only)
    obj_ptr: false                 # obj_ptr.* (video only)
    
    # ==========================================================================
    # FINE-GRAINED LAYER FREEZING
    # ==========================================================================
    # Freeze only first N layers of vision backbone (null = use vision_backbone flag)
    # Useful for gradual unfreezing - start with high N, decrease over training
    # ViT has 32 blocks (0-31), so valid values are 0-32
    vision_backbone_num_frozen_layers: null  # e.g., 24 to freeze first 24 ViT blocks
    
    # Custom patterns to freeze (Unix glob syntax)
    # Examples:
    # - "backbone.vision_backbone.trunk.blocks.0.*"  # First ViT block
    # - "backbone.vision_backbone.trunk.blocks.[0-5].*"  # First 6 blocks
    # - "geometry_encoder.encode.0.*"  # First geometry encoder layer
    # - "transformer.decoder.layers.0.*"  # First decoder layer
    # - "*.bias"  # All bias terms
    custom_patterns: []
    
    # Freeze EVERYTHING except these patterns (for adapter-style training)
    # When set, ignores all other freeze settings and only trains matched params
    # Examples:
    # - "segmentation_head.*"  # Only train segmentation head
    # - "transformer.decoder.layers.5.*"  # Only train last decoder layer
    # - "geometry_encoder.*"  # Only train geometry encoder
    freeze_all_except: []
    
    # Patterns to explicitly unfreeze (highest priority, overrides other settings)
    # Useful for unfreezing specific layers in a mostly-frozen model
    # Examples:
    # - "backbone.vision_backbone.trunk.blocks.31.*"  # Unfreeze last ViT block
    # - "backbone.language_backbone.encoder.ln_final.*"  # Unfreeze final layer norm
    unfreeze_patterns: []

  distributed:
    backend: nccl
    find_unused_parameters: True  # Required when some params are frozen
    gradient_as_bucket_view: True

  loss:
    holes: ${holes_train.loss}
    default:
      _target_: sam3.train.loss.sam3_loss.DummyLoss

  data:
    train:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
        limit_ids: ${holes_train.num_images}
        transforms: ${holes_train.train_transforms}
        load_segmentation: ${scratch.enable_segmentation}
        max_ann_per_img: 500000
        multiplier: 1
        max_train_queries: 50000
        max_val_queries: 50000
        training: true
        use_caching: False
        img_folder: ${paths.dataset_root}/train/images
        ann_file: ${paths.dataset_root}/sam3_format/annotations/instances_train.json

      shuffle: True
      batch_size: ${scratch.train_batch_size}
      num_workers: ${scratch.num_train_workers}
      pin_memory: True
      drop_last: True
      collate_fn: ${scratch.collate_fn}

    val:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
        load_segmentation: ${scratch.enable_segmentation}
        coco_json_loader:
          _target_: sam3.train.data.coco_json_loaders.COCO_FROM_JSON
          include_negatives: true
          category_chunk_size: 2
          _partial_: true
        img_folder: ${paths.dataset_root}/val/images
        ann_file: ${paths.dataset_root}/sam3_format/annotations/instances_val.json
        transforms: ${holes_train.val_transforms}
        max_ann_per_img: 100000
        multiplier: 1
        training: false

      shuffle: False
      batch_size: ${scratch.val_batch_size}
      num_workers: ${scratch.num_val_workers}
      pin_memory: True
      drop_last: False
      collate_fn: ${scratch.collate_fn_val}

  model:
    _target_: sam3.model_builder.build_sam3_image_model
    bpe_path: ${paths.bpe_path}
    device: cpu
    eval_mode: false
    enable_segmentation: ${scratch.enable_segmentation}

  meters: 
    train:
      holes:
        segmentation_metrics:
          _target_: sam3.eval.segmentation_metrics.SegmentationMetricsMeter
          num_vis_samples: 0
          erosion_kernel_size: 5
          erosion_iterations: 2
          device: cuda
          metric_prefix: cc_metrics
          vis_prefix: cc_vis
    
    val:
      holes:
        detection:
          _target_: sam3.eval.coco_writer.PredictionDumper
          iou_type: "bbox"
          dump_dir: ${launcher.experiment_log_dir}/dumps/holes
          merge_predictions: True
          postprocessor: ${scratch.original_box_postprocessor}
          gather_pred_via_filesys: ${scratch.gather_pred_via_filesys}
          maxdets: 100
          pred_file_evaluators:
            - _target_: sam3.eval.coco_eval_offline.CocoEvaluatorOfflineWithPredFileEvaluators
              gt_path: ${paths.dataset_root}/sam3_format/annotations/instances_val.json
              tide: False
              iou_type: "bbox"
        
        segmentation_metrics:
          _target_: sam3.eval.segmentation_metrics.SegmentationMetricsMeter
          num_vis_samples: 10
          erosion_kernel_size: 5
          erosion_iterations: 2
          device: cuda
          metric_prefix: cc_metrics
          vis_prefix: cc_vis

  optim:
    amp:
      enabled: True
      amp_dtype: bfloat16

    optimizer:
      _target_: torch.optim.AdamW

    gradient_clip:
      _target_: sam3.train.optim.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2

    # NOTE: param_group_modifiers still work for trainable parameters
    # Frozen parameters automatically get lr=0 since they have requires_grad=False
    param_group_modifiers:
      - _target_: sam3.train.optim.optimizer.layer_decay_param_modifier
        _partial_: True
        layer_decay_value: ${scratch.lrd_vision_backbone}
        apply_to: 'backbone.vision_backbone.trunk'
        overrides:
          - pattern: '*pos_embed*'
            value: 1.0

    options:
      lr:
        - scheduler:  # transformer and class_embed (decoder components)
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_transformer}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
        - scheduler:  # Vision backbone (may be frozen)
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_vision_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - 'backbone.vision_backbone.*'
        - scheduler:  # Language backbone (may be frozen)
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_language_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - 'backbone.language_backbone.*'

      weight_decay:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: ${scratch.wd}
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          param_names:
            - '*bias*'
          module_cls_names: ['torch.nn.LayerNorm']

  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 100
    # NOTE: skip_saving_parameters is auto-populated with frozen parameter patterns
    # This reduces checkpoint size by not saving frozen weights

  logging:
    tensorboard_writer:
      _target_: sam3.train.utils.logger.make_tensorboard_logger
      log_dir: ${launcher.experiment_log_dir}/tensorboard
      flush_secs: 120
      should_log: True
    wandb_writer: null
    log_dir: ${launcher.experiment_log_dir}/logs
    log_freq: 10

# ============================================================================
# Launcher Configuration
# ============================================================================

launcher:
  num_nodes: 1
  gpus_per_node: 1
  experiment_log_dir: ${paths.experiment_log_dir}
  multiprocessing_context: forkserver

submitit:
  account: null
  partition: null
  qos: null
  timeout_hour: 72
  use_cluster: False
  cpus_per_task: 10
  port_range: [10000, 65000]
  constraint: null
